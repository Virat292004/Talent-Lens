<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#34465b"/></marker>
    <marker id="eventArrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#df6b20"/></marker>
    <style>
      text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#172b43}.title{font-size:28px;font-weight:700}.sub{font-size:14px;fill:#53677c}.boxTitle{font-size:16px;font-weight:700;fill:#fff}.boxSub{font-size:12px;fill:#e9f1fa}.label{font-size:14px;font-weight:700}.small{font-size:12px;fill:#53677c}.dbTitle{font-size:15px;font-weight:700}.dbSub{font-size:12px;fill:#53677c}.line{stroke:#34465b;stroke-width:2;fill:none;marker-end:url(#arrow)}.event{stroke:#df6b20;stroke-width:2;fill:none;marker-end:url(#eventArrow)}.dash{stroke-dasharray:5 5}
    </style>
  </defs>
  <rect width="1400" height="900" fill="#f7f9fc"/>
  <text x="48" y="48" class="title">TALENTLENS — High-Level Design</text>
  <text x="48" y="74" class="sub">Recruiter workflow • event-driven services • authoritative stores and read projections</text>

  <!-- client -->
  <rect x="48" y="115" width="180" height="105" rx="14" fill="#fff" stroke="#8797a8" stroke-width="2"/>
  <text x="138" y="148" text-anchor="middle" class="label">Recruiter Client</text>
  <text x="138" y="174" text-anchor="middle" class="small">React + TypeScript + Vite</text>
  <text x="138" y="194" text-anchor="middle" class="small">Jobs • resumes • rankings</text>

  <!-- gateway -->
  <rect x="350" y="105" width="760" height="125" rx="18" fill="#e96816"/>
  <text x="730" y="145" text-anchor="middle" class="boxTitle" style="font-size:22px">API GATEWAY · FastAPI · :8080</text>
  <text x="730" y="178" text-anchor="middle" class="boxSub">Routing · JWT authorization · Redis rate limits · circuit breakers · correlation IDs</text>
  <text x="730" y="201" text-anchor="middle" class="boxSub">HTTPX forwarding · validation · structured logs · controlled failures</text>
  <path d="M228 166 H350" class="line"/>
  <text x="289" y="153" text-anchor="middle" class="small">HTTPS / JSON</text>

  <!-- services -->
  <g>
    <rect x="48" y="310" width="198" height="105" rx="13" fill="#155b9a"/><text x="147" y="345" text-anchor="middle" class="boxTitle">Job Service</text><text x="147" y="372" text-anchor="middle" class="boxSub">FastAPI · :5001</text><text x="147" y="395" text-anchor="middle" class="boxSub">JD + requirements</text>
    <rect x="267" y="310" width="198" height="105" rx="13" fill="#155b9a"/><text x="366" y="345" text-anchor="middle" class="boxTitle">Resume Service</text><text x="366" y="372" text-anchor="middle" class="boxSub">FastAPI · :5002</text><text x="366" y="395" text-anchor="middle" class="boxSub">Upload + private storage</text>
    <rect x="486" y="310" width="198" height="105" rx="13" fill="#155b9a"/><text x="585" y="345" text-anchor="middle" class="boxTitle">Candidate Service</text><text x="585" y="372" text-anchor="middle" class="boxSub">FastAPI · :5003</text><text x="585" y="395" text-anchor="middle" class="boxSub">Identity + associations</text>
    <rect x="705" y="310" width="198" height="105" rx="13" fill="#155b9a"/><text x="804" y="345" text-anchor="middle" class="boxTitle">Parsing Service</text><text x="804" y="372" text-anchor="middle" class="boxSub">FastAPI · :5004</text><text x="804" y="395" text-anchor="middle" class="boxSub">PDF/DOCX → profile</text>
    <rect x="924" y="310" width="198" height="105" rx="13" fill="#155b9a"/><text x="1023" y="345" text-anchor="middle" class="boxTitle">Matching Service</text><text x="1023" y="372" text-anchor="middle" class="boxSub">FastAPI · :5005</text><text x="1023" y="395" text-anchor="middle" class="boxSub">Explainable score engine</text>
    <rect x="1143" y="310" width="198" height="105" rx="13" fill="#155b9a"/><text x="1242" y="345" text-anchor="middle" class="boxTitle">Ranking Service</text><text x="1242" y="372" text-anchor="middle" class="boxSub">FastAPI · :5006</text><text x="1242" y="395" text-anchor="middle" class="boxSub">Read projection + export</text>
  </g>
  <path d="M730 230 V265 H147 V310 M730 265 H366 V310 M730 265 H585 V310 M730 265 H804 V310 M730 265 H1023 V310 M730 265 H1242 V310" class="line"/>

  <!-- data ownership layer -->
  <rect x="48" y="465" width="1293" height="155" rx="15" fill="#fff" stroke="#8797a8" stroke-width="2"/>
  <text x="72" y="493" class="label">DATA LAYER · service-owned access</text>
  <rect x="93" y="515" width="570" height="78" rx="12" fill="#edf4fb" stroke="#8da9c4"/>
  <!-- PostgreSQL elephant mark -->
  <path d="M114 536c1-8 9-12 20-11 10 1 16 6 16 14v10c0 5-4 8-8 8h-3v-8h-5v10h-8v-11h-5v8h-7v-12c-5-1-7-4-7-8z" fill="#336791"/><path d="M146 545c8 0 9 6 6 10l-4 4" fill="none" stroke="#336791" stroke-width="5" stroke-linecap="round"/><circle cx="140" cy="537" r="1.5" fill="#fff"/>
  <text x="176" y="547" class="dbTitle">PostgreSQL · authoritative records</text><text x="176" y="570" class="dbSub">Jobs · resume metadata · candidate IDs · match results · outbox</text>
  <rect x="735" y="515" width="560" height="78" rx="12" fill="#eef7f2" stroke="#8eb9a2"/>
  <!-- MongoDB leaf mark -->
  <path d="M777 530c-12 12-17 22-12 34 3 7 9 11 15 12 7-7 11-16 8-26-2-8-6-14-11-20z" fill="#47a248"/><path d="M779 539v32" stroke="#e9f5eb" stroke-width="2"/>
  <text x="818" y="547" class="dbTitle">MongoDB · document/read models</text><text x="818" y="570" class="dbSub">Parsed profiles · ranking projection · denormalized read views</text>
  <!-- ownership links -->
  <path d="M147 415 V465 M366 415 V465 M585 415 V465 M1023 415 V465" class="line dash"/>
  <path d="M804 415 V465 M1242 415 V465" class="line dash"/>

  <!-- event bus -->
  <path d="M94 670 L121 640 H1268 L1295 670 L1268 700 H121 Z" fill="#e96816"/>
  <!-- RabbitMQ mark (rabbit silhouette) -->
  <g transform="translate(605 651)" fill="#fff">
    <ellipse cx="22" cy="18" rx="12" ry="9"/><ellipse cx="15" cy="6" rx="3.5" ry="10" transform="rotate(-12 15 6)"/><ellipse cx="25" cy="5" rx="3.5" ry="11" transform="rotate(8 25 5)"/><circle cx="34" cy="15" r="4"/><circle cx="8" cy="19" r="4"/><circle cx="28" cy="13" r="1.2" fill="#e96816"/>
  </g>
  <text x="700" y="666" text-anchor="middle" class="boxTitle" style="font-size:19px">RabbitMQ · durable event bus</text>
  <text x="695" y="687" text-anchor="middle" class="boxSub">Versioned events · persistent delivery · retries / DLQ · idempotent consumers</text>
  <path d="M147 620 V651 M366 620 V651 M585 620 V651 M804 620 V651 M1023 620 V651 M1242 620 V651" class="event"/>
  <text x="695" y="730" text-anchor="middle" class="small">ResumeUploaded → parsing → ResumeParsed → matching → CandidateEvaluated → ranking projection</text>

  <!-- infra services -->
  <rect x="48" y="770" width="1293" height="92" rx="15" fill="#fff" stroke="#8797a8" stroke-width="2"/>
  <text x="75" y="805" class="label">OBSERVABILITY</text>
  <rect x="260" y="786" width="205" height="58" rx="10" fill="#f0f4f8"/><text x="362" y="810" text-anchor="middle" class="label">Redis</text><text x="362" y="831" text-anchor="middle" class="small">Rate limiting</text>
  <rect x="500" y="786" width="220" height="58" rx="10" fill="#f0f4f8"/><text x="610" y="810" text-anchor="middle" class="label">Private file storage</text><text x="610" y="831" text-anchor="middle" class="small">ResumeService owned</text>
  <rect x="755" y="786" width="260" height="58" rx="10" fill="#f0f4f8"/>
  <!-- Prometheus flame -->
  <path d="M780 827c-7-10 2-16 1-26 9 7 10 13 7 17 6-3 8-8 6-13 10 10 8 20-1 24-5 2-9 1-13-2z" fill="#e6522c"/>
  <text x="864" y="810" text-anchor="middle" class="label">Prometheus</text><text x="864" y="831" text-anchor="middle" class="small">Metrics collection</text>
  <rect x="1050" y="786" width="250" height="58" rx="10" fill="#f0f4f8"/>
  <!-- Zipkin magnifier mark -->
  <circle cx="1082" cy="808" r="11" fill="none" stroke="#263b57" stroke-width="3"/><path d="M1090 816l11 11" stroke="#263b57" stroke-width="4" stroke-linecap="round"/><circle cx="1082" cy="808" r="3" fill="#e6522c"/>
  <text x="1174" y="810" text-anchor="middle" class="label">Zipkin</text><text x="1174" y="831" text-anchor="middle" class="small">Distributed traces</text>
  <!-- Grafana mark integrated alongside dashboard/metrics tile -->
  <path d="M973 799a14 14 0 1 0 1 22M973 799l-3 8 8-1M970 807l7 5m-7-5-4 8m4-8 9 2" fill="none" stroke="#f28c28" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="885" y="856" text-anchor="middle" class="small">Grafana dashboards</text>
  <path d="M730 230 V245 H362 V786" class="line dash"/>
  <path d="M804 415 V745 H610 V786" class="line dash"/>
  <path d="M730 230 V755 H885 V786 M730 230 V765 H1175 V786" class="line dash"/>

</svg>
