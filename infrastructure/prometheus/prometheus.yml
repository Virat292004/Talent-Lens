global:
  scrape_interval: 15s
scrape_configs:
  - job_name: talentlens-gateway
    metrics_path: /metrics
    static_configs:
      - targets: [gateway:8080]
  - job_name: talentlens-services
    metrics_path: /metrics
    static_configs:
      - targets: [job-service:5001, resume-service:5002, candidate-service:5003, parsing-service:5004, matching-service:5005, ranking-service:5006]
  - job_name: rabbitmq
    metrics_path: /metrics
    static_configs:
      - targets: [rabbitmq:15692]
